<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ดช่อง YouTube — 22 ต.ค.–18 พ.ย. 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg0: #07081a;
      --bg1: #14123c;
      --bg2: #0b1630;
      --glass: rgba(255,255,255,0.07);
      --glass-2: rgba(255,255,255,0.1);
      --text: #f7f6ff;
      --muted: #b4b1c9;
      --line: rgba(255,255,255,0.14);
      --accent: #8ea8ff;
      --accent-2: #f5b942;
      --accent-3: #3ee0c5;
      --warn: #ffb086;
      --lion: #f5b942;
      --ai: #3ee0c5;
      --raisara: #c084fc;
      --english: #fb7185;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Prompt", "Noto Sans Thai", "Sarabun", sans-serif;
      background:
        radial-gradient(1200px 700px at 8% -10%, rgba(88, 70, 200, 0.45), transparent 55%),
        radial-gradient(900px 600px at 100% 0%, rgba(20, 180, 160, 0.22), transparent 50%),
        radial-gradient(800px 500px at 70% 100%, rgba(245, 185, 66, 0.12), transparent 45%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 48%, var(--bg2));
      background-attachment: fixed;
      line-height: 1.55;
    }
    main { max-width: 1160px; margin: 0 auto; padding: 36px 20px 88px; position: relative; z-index: 1; }
    h1, h2, h3, h4 { font-family: "Prompt", "Noto Sans Thai", sans-serif; font-weight: 600; letter-spacing: -0.02em; }
    h1 { font-size: clamp(1.8rem, 3vw, 2.3rem); line-height: 1.2; margin: 0 0 10px; }
    h2 { font-size: 1.3rem; margin: 0 0 14px; }
    h3 { font-size: 1.05rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .lead, .muted, footer, .caveat, .ev { color: var(--muted); }
    .lead { font-size: 1.08rem; margin-bottom: 18px; max-width: 46rem; }
    nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; }
    nav.toc a {
      color: var(--text);
      text-decoration: none;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.9rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }
    nav.toc a:hover { transform: translateY(-2px); background: var(--glass-2); border-color: rgba(255,255,255,0.28); }
    .glass, section.source, section.block, .chart-card, .advice-card, .advice-action, .advice-week, .advice-test, .login, .placeholder, .metric, .kpi {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    section.source, section.block {
      border-radius: var(--radius);
      padding: 24px;
      margin: 0 0 22px;
    }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0 22px; }
    @media (max-width: 900px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .metrics { grid-template-columns: 1fr; } }
    .kpi {
      border-radius: 20px;
      padding: 18px 18px 16px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .kpi::after {
      content: "";
      position: absolute;
      inset: auto -20% -40% auto;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: var(--kpi, var(--accent));
      opacity: 0.16;
      pointer-events: none;
    }
    .kpi:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.4); border-color: color-mix(in srgb, var(--kpi, var(--accent)) 55%, white); }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .kpi-icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--kpi, var(--accent)) 22%, transparent);
      color: var(--kpi, var(--accent));
    }
    .kpi-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .kpi-trend {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.75rem; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
      color: #073b2e; background: #3ee0c5;
    }
    .kpi-trend.neutral { color: var(--text); background: rgba(255,255,255,0.12); font-weight: 500; }
    .kpi b, .kpi .kpi-value { display: block; font-size: clamp(1.6rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    .kpi span, .kpi .kpi-label { color: var(--muted); font-size: 0.86rem; margin-top: 6px; display: block; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
    .chart-card { border-radius: 20px; padding: 16px 16px 10px; transition: transform 0.2s ease, border-color 0.2s ease; }
    .chart-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.28); }
    .chart-card h3 { margin-bottom: 4px; }
    .chart-wrap { position: relative; height: 270px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; margin: 12px 0 16px; }
    th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th:not(:first-child), td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
    th { font-weight: 600; color: var(--muted); font-size: 0.8rem; }
    tr { transition: background 0.15s ease; }
    tr:hover td { background: rgba(255,255,255,0.04); }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .tabs button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }
    .tabs button:hover { transform: translateY(-2px); background: var(--glass-2); }
    .tabs button[aria-pressed="true"] {
      background: var(--tab, var(--accent));
      color: #0b1020;
      border-color: transparent;
      font-weight: 600;
    }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 20px; }
    .updated { color: var(--muted); font-size: 0.95rem; }
    .refresh-btn {
      background: linear-gradient(135deg, #8ea8ff, #3ee0c5);
      color: #0b1020;
      border: 0;
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(62,224,197,0.25); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .refresh-status { color: var(--muted); font-size: 0.9rem; }
    .refresh-status.err { color: var(--warn); }
    .meaning { margin: 8px 0 0; }
    .placeholder { border-style: dashed; border-radius: 16px; padding: 16px; color: var(--muted); box-shadow: none; }
    .advice-grid { display: grid; gap: 18px; }
    .advice-card { border-radius: 20px; padding: 20px; transition: transform 0.2s ease, border-color 0.2s ease; }
    .advice-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.28); }
    .advice-card h3 { margin: 0 0 10px; font-size: 1.15rem; }
    .advice-handle { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
    .advice-list { margin: 0; padding-left: 1.15rem; }
    .advice-list li { margin: 0 0 8px; }
    .advice-block { margin-top: 16px; }
    .advice-block h4 { margin: 0 0 8px; font-size: 0.92rem; color: var(--muted); }
    .advice-actions { display: grid; gap: 10px; }
    .advice-action {
      border-radius: 16px;
      padding: 12px 14px;
      border-left: 4px solid var(--accent-3);
      box-shadow: none;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .advice-action:hover { transform: translateY(-2px); }
    .advice-action strong { display: block; margin-bottom: 4px; }
    .advice-action .ev { font-size: 0.88rem; margin-top: 4px; }
    .advice-plan { display: grid; gap: 8px; }
    @media (min-width: 800px) { .advice-plan { grid-template-columns: 1fr 1fr; } }
    .advice-week { border-radius: 16px; padding: 12px 14px; box-shadow: none; }
    .advice-week b { display: block; margin-bottom: 4px; color: var(--accent-3); }
    .advice-test { border-radius: 16px; padding: 12px 14px; margin: 0 0 8px; box-shadow: none; }
    .caution { color: var(--warn); font-size: 0.9rem; margin: 4px 0 0; }
    .login {
      max-width: 440px;
      margin: 14vh auto 0;
      border-radius: 24px;
      padding: 32px 28px;
    }
    .login h1 { margin-bottom: 8px; }
    .login input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      margin: 0 0 14px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .login input[type="password"]:focus { border-color: var(--accent-3); box-shadow: 0 0 0 3px rgba(62,224,197,0.2); }
    .login .error { display: none; margin: 8px 0 0; color: var(--warn); }
    .login .error.show { display: block; }
    a { color: var(--accent); }
    .error { color: var(--warn); padding: 20px; }

    .section-error {
      border: 1px solid #ff6b6b;
      background: rgba(220, 50, 50, 0.18);
      color: #ffd6d6;
      border-radius: 16px;
      padding: 14px 16px;
      margin: 0 0 16px;
    }
    .section-error strong { display: block; color: #ffb4b4; margin-bottom: 6px; font-size: 1rem; }
    .section-error p { margin: 0 0 4px; }
    .section-error .updated { margin: 6px 0 0; color: #ffd6d6; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.78rem; font-weight: 600;
      padding: 3px 10px; border-radius: 999px;
      margin: 0 8px 8px 0; vertical-align: middle;
    }
    .live-badge.live { background: #3ee0c5; color: #073b2e; }
    .live-badge.snap { background: rgba(255,255,255,0.12); color: var(--text); font-weight: 500; }
    .live-badge.mixed { background: #f5b942; color: #2a1d00; }
    .pattern-grid { display: grid; gap: 12px; margin: 12px 0 16px; }
    @media (min-width: 800px) { .pattern-grid { grid-template-columns: 1fr 1fr; } }
    .pattern-card {
      border-radius: 16px; padding: 14px 16px;
      background: var(--glass); border: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .pattern-card h3 { margin: 0 0 4px; font-size: 1rem; }
    .pattern-card .for { color: var(--muted); font-size: 0.86rem; margin-bottom: 8px; }
    .pattern-card .do-not { color: var(--warn); margin: 8px 0 0; font-size: 0.92rem; }
    .h-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
    .h-row h2 { margin: 0; }
    footer { font-size: 0.85rem; margin-top: 24px; }
  </style>
</head>
<body>
  <main id="app">
    <p class="muted">กำลังโหลดหน้าเข้าสู่ระบบ…</p>
  </main>
  <script>
    const SOURCE_ORDER = ["studio", "advice", "tubealfred", "ads"];
    const STALE_MS = 36 * 60 * 60 * 1000;
    const YT_SCOPES = "https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly";
    let snapshotData = null;
    let accessToken = null;
    let tokenExpiresAt = 0;
    let tokenClient = null;
    let liveMeta = { status: "idle", error: null, fetchedAt: null, studioError: null, competitorError: null, analyticsOk: {}, mineNote: "" };
    const RENDERERS = {
      studio: renderStudio,
      tubealfred: renderTubeAlfred,
      ads: renderAds,
      advice: renderAdvice,
    };
    const charts = [];

    const fmt = (n, d = 0) => {
      if (n === null || n === undefined || n === "") return "—";
      const x = Number(n);
      if (!Number.isFinite(x)) return "—";
      return x.toLocaleString("th-TH", { maximumFractionDigits: d, minimumFractionDigits: d });
    };
    const fmtHours = (n) => fmt(n, Math.abs(Number(n)) < 1 ? 3 : 1);
    const fmtPct = (n) => (n === null || n === undefined ? "—" : `${fmt(n, 2)}%`);
    const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

    function formatUpdated(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      const parts = new Intl.DateTimeFormat("th-TH", {
        timeZone: "Asia/Bangkok",
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).format(d);
      return parts + " เวลาไทย (Asia/Bangkok)";
    }

    function isStale(iso, ms) {
      if (!iso) return true;
      const t = new Date(iso).getTime();
      if (Number.isNaN(t)) return true;
      return (Date.now() - t) > (ms == null ? STALE_MS : ms);
    }

    function sectionError(reason, updatedAt) {
      const box = el("div", { class: "section-error", role: "alert" });
      box.append(el("strong", { text: "ข้อมูลส่วนนี้ใช้ไม่ได้ชั่วคราว" }));
      box.append(el("p", { text: reason || "โหลดข้อมูลส่วนนี้ไม่สำเร็จ" }));
      if (updatedAt) box.append(el("p", { class: "updated", text: "อัปเดตล่าสุด " + formatUpdated(updatedAt) }));
      else box.append(el("p", { class: "updated", text: "ยังไม่ทราบเวลาอัปเดตของส่วนนี้" }));
      return box;
    }

    function liveBadge(kind, text) {
      return el("span", { class: "live-badge " + (kind || "snap"), text: text });
    }

    function googleClientId() {
      const cfg = window.DASHBOARD_CONFIG || {};
      return String(cfg.GOOGLE_CLIENT_ID || "").trim();
    }

    function periodTotals(ch) {
      if (ch && ch.live && ch.live.analytics_ok && ch.live.last_28d) return ch.live.last_28d;
      return (ch && ch.totals) || {};
    }

    function lifetimeTotals(ch) {
      if (ch && ch.live && ch.live.lifetime) return ch.live.lifetime;
      return (ch && ch.totals_lifetime) || null;
    }
    const el = (tag, attrs = {}, kids = []) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "html") node.innerHTML = v;
        else if (k === "text") node.textContent = v;
        else if (k === "class") node.className = v;
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
      }
      for (const kid of [].concat(kids)) {
        if (kid == null || kid === false) continue;
        node.append(kid.nodeType ? kid : document.createTextNode(kid));
      }
      return node;
    };

    function chartColors() {
      const s = getComputedStyle(document.documentElement);
      return {
        text: s.getPropertyValue("--text").trim(),
        muted: s.getPropertyValue("--muted").trim(),
        line: s.getPropertyValue("--line").trim(),
        c0: s.getPropertyValue("--accent").trim(),
        c1: s.getPropertyValue("--accent-2").trim(),
        c2: s.getPropertyValue("--accent-3").trim(),
      };
    }

    const CHANNEL_COLOR = {
      "lion-lykan": "#f5b942",
      "ai-arai-kan-nee": "#3ee0c5",
      "raisarapai": "#c084fc",
      "english-with-meow": "#fb7185",
    };
    const CHANNEL_COLOR_BY_NAME = {
      "พี่ไลอ้อน กับ น้องไลแค่น": "#f5b942",
      "AI อะไรกันเนี่ย": "#3ee0c5",
      "ไร้สาระ ไปวันๆ": "#c084fc",
      "English with แมว": "#fb7185",
    };

    function makeBarChart(canvas, labels, values, color) {
      if (!canvas) return null;
      if (typeof Chart !== "undefined") {
        const prev = Chart.getChart(canvas);
        if (prev) prev.destroy();
      }
      const c = chartColors();
      const bg = Array.isArray(color)
        ? color
        : (color
            ? color
            : labels.map((lb) => CHANNEL_COLOR_BY_NAME[lb] || CHANNEL_COLOR[lb] || c.c0));
      if (typeof Chart !== "undefined") {
        Chart.defaults.font.family = '"Prompt", "Noto Sans Thai", sans-serif';
        Chart.defaults.color = c.muted;
      }
      const chart = new Chart(canvas, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: bg,
            borderWidth: 0,
            borderRadius: 12,
            borderSkipped: false,
            maxBarThickness: 28,
          }],
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmt(ctx.raw) } } },
          scales: {
            x: { ticks: { color: c.muted, callback: (v) => fmt(v) }, grid: { color: "rgba(255,255,255,0.08)" } },
            y: { ticks: { color: c.text }, grid: { display: false } },
          },
        },
      });
      charts.push(chart);
      return chart;
    }

    function svgIcon(pathD) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", pathD);
      svg.appendChild(path);
      return svg;
    }
    const ICONS = {
      views: "M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z M12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5",
      users: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75",
    };
    // split paths: svgIcon only takes one path. Use two path elements if needed.
    function iconNamed(name) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      const ds = name === "users"
        ? ["M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2","M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8","M22 21v-2a4 4 0 0 0-3-3.87","M16 3.13a4 4 0 0 1 0 7.75"]
        : ["M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z","M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"];
      for (const d of ds) {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", d);
        svg.appendChild(path);
      }
      return svg;
    }
    function kpiTile(value, label, color, icon, trend, trendKind) {
      const tile = el("div", { class: "kpi" });
      tile.style.setProperty("--kpi", color);
      const top = el("div", { class: "kpi-top" });
      const ic = el("div", { class: "kpi-icon" });
      ic.append(iconNamed(icon));
      top.append(ic);
      if (trend) {
        const tr = el("div", { class: "kpi-trend" + (trendKind === "neutral" ? " neutral" : "") });
        tr.append(document.createTextNode((trendKind === "up" ? "▲ " : "") + trend));
        top.append(tr);
      }
      tile.append(top);
      tile.append(el("div", { class: "kpi-value", text: value }));
      tile.append(el("div", { class: "kpi-label", text: label }));
      return tile;
    }

    function videoTable(videos, caption) {
      if (!videos || !videos.length) return null;
      const wrap = el("div");
      if (caption) wrap.append(el("h3", { text: caption }));
      const table = el("table");
      table.append(el("thead", {}, el("tr", {}, [
        el("th", { text: "คลิป" }),
        el("th", { text: "วิวตลอดชีพ" }),
        el("th", { text: "วิว 28 วัน" }),
        el("th", { text: "ผู้ติดตาม 28 วัน" }),
        el("th", { text: "% การดู" }),
        el("th", { text: "CTR" }),
        el("th", { text: "วินาที" }),
      ])));
      const body = el("tbody");
      for (const v of videos) {
        const title = v.url
          ? el("a", { href: v.url, target: "_blank", rel: "noopener", text: v.title || v.id })
          : (v.title || v.id);

    function b64ToBytes(s) {
      const bin = atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function decryptData(payload, password) {
      const salt = b64ToBytes(payload.salt);
      const iv = b64ToBytes(payload.iv);
      const data = b64ToBytes(payload.data);
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt,
          iterations: payload.iter,
          hash: payload.hash || "SHA-256",
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function bangkokYmd(date) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Bangkok",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(date || new Date());
    }
    function addDaysYmd(ymd, delta) {
      const parts = ymd.split("-").map(Number);
      const dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      dt.setUTCDate(dt.getUTCDate() + delta);
      return dt.toISOString().slice(0, 10);
    }
    function last28Range() {
      const end = bangkokYmd();
      return { start: addDaysYmd(end, -27), end: end };
    }
    function parseIsoDuration(text) {
      const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(text || "");
      if (!m) return null;
      return ((Number(m[1]) || 0) * 3600) + ((Number(m[2]) || 0) * 60) + (Number(m[3]) || 0);
    }
    function nowBangkokIso() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Bangkok",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).formatToParts(new Date());
      const get = (t) => (parts.find((p) => p.type === t) || {}).value;
      return get("year") + "-" + get("month") + "-" + get("day") + "T" + get("hour") + ":" + get("minute") + "+07:00";
    }
    function waitForGis(timeout) {
      const ms = timeout || 15000;
      return new Promise((resolve, reject) => {
        if (window.google && google.accounts && google.accounts.oauth2) return resolve();
        const t0 = Date.now();
        const iv = setInterval(() => {
          if (window.google && google.accounts && google.accounts.oauth2) {
            clearInterval(iv);
            resolve();
          } else if (Date.now() - t0 > ms) {
            clearInterval(iv);
            const err = new Error("gis timeout");
            err.reason = "gis";
            reject(err);
          }
        }, 100);
      });
    }
    function classifyLiveError(err) {
      const status = err && err.status;
      const reason = String((err && err.reason) || "");
      const msg = String((err && err.message) || "");
      const blob = reason + " " + msg + " " + JSON.stringify((err && err.body) || {});
      if (reason === "gis") return "โหลดหน้าเข้าสู่ระบบของ Google ไม่สำเร็จ ลองรีเฟรชหน้านี้ ส่วนอื่นยังใช้สำเนารายวันได้";
      if (status === "access_denied" || status === "popup_closed_by_user" || /access_denied|popup_closed|user_denied/i.test(blob)) {
        return "เข้าสู่ระบบ Google ไม่สำเร็จ หรือยกเลิกไปแล้ว ยังใช้สำเนารายวัน ส่วนอื่นยังใช้ได้";
      }
      if (/quotaExceeded|dailyLimitExceeded|rateLimitExceeded/i.test(blob)) {
        return "โควตา YouTube API เต็มชั่วคราว ยังใช้สำเนารายวัน ส่วนอื่นยังใช้ได้";
      }
      if (status === 401) return "สิทธิ์หมดอายุหรือยังไม่ได้อนุญาต ลองเข้าสู่ระบบอีกครั้ง ยังใช้สำเนารายวัน ส่วนอื่นยังใช้ได้";
      if (status === 403) return "YouTube ปฏิเสธคำขอ อาจเพราะบัญชีนี้ไม่มีสิทธิ์ดูช่อง หรือโควตาเต็ม ยังใช้สำเนารายวัน ส่วนอื่นยังใช้ได้";
      if (/Failed to fetch|NetworkError|network|offline|TypeError|gis timeout/i.test(msg)) {
        return "เชื่อมต่อเครือข่ายไปยัง YouTube ไม่ได้ ยังใช้สำเนารายวัน ส่วนอื่นยังใช้ได้";
      }
      return "ดึงข้อมูลสดจาก YouTube ไม่สำเร็จ ยังใช้สำเนารายวัน ส่วนอื่นยังใช้ได้";
    }
    async function ytFetch(url) {
      const res = await fetch(url, { headers: { Authorization: "Bearer " + accessToken } });
      const text = await res.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch (e) { body = text; }
      if (!res.ok) {
        const err = new Error("HTTP " + res.status);
        err.status = res.status;
        err.body = body;
        const details = body && body.error && body.error.errors && body.error.errors[0];
        err.reason = (details && details.reason) || (body && body.error && body.error.status) || "";
        throw err;
      }
      return body;
    }
    async function requestAccessToken(prompt) {
      if (!googleClientId()) throw new Error("missing client id");
      await waitForGis();
      if (!tokenClient) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: googleClientId(),
          scope: YT_SCOPES,
          hint: "sitthinon.ma@gmail.com",
          callback: function () {},
        });
      }
      return new Promise((resolve, reject) => {
        tokenClient.callback = function (resp) {
          if (!resp || resp.error) {
            const err = new Error((resp && (resp.error_description || resp.error)) || "access_denied");
            err.status = resp && resp.error;
            reject(err);
            return;
          }
          accessToken = resp.access_token;
          tokenExpiresAt = Date.now() + ((Number(resp.expires_in) || 3600) - 60) * 1000;
          resolve(accessToken);
        };
        tokenClient.requestAccessToken({ prompt: prompt || "", hint: "sitthinon.ma@gmail.com" });
      });
    }
    function parseReport(payload) {
      const headers = ((payload && payload.columnHeaders) || []).map((h) => h.name);
      const rows = (payload && payload.rows) || [];
      return rows.map((row) => {
        const out = {};
        headers.forEach((name, i) => { out[name] = row[i]; });
        return out;
      });
    }
    function metricsFromRow(row) {
      if (!row) return null;
      const minutes = Number(row.estimatedMinutesWatched || 0);
      return {
        views: Number(row.views || 0),
        watch_time_hours: minutes / 60,
        subscribers_attributed: Number(row.subscribersGained || 0),
        subscribers_gained: Number(row.subscribersGained || 0),
        impressions: row.impressions == null ? null : Number(row.impressions),
        ctr_percent: row.impressionClickThroughRate == null ? null : Number(row.impressionClickThroughRate),
        average_view_duration_seconds: row.averageViewDuration == null ? null : Number(row.averageViewDuration),
        average_percentage_viewed: row.averageViewPercentage == null ? null : Number(row.averageViewPercentage),
      };
    }
    async function analyticsReport(channelId, start, end, extra) {
      const params = new URLSearchParams({
        ids: "channel==" + channelId,
        startDate: start,
        endDate: end,
        metrics: "views,estimatedMinutesWatched,subscribersGained,averageViewDuration,averageViewPercentage,impressions,impressionClickThroughRate",
      });
      if (extra) {
        Object.keys(extra).forEach((k) => params.set(k, String(extra[k])));
      }
      return ytFetch("https://youtubeanalytics.googleapis.com/v2/reports?" + params.toString());
    }
    async function fetchChannelsByIds(ids) {
      const unique = [...new Set(ids.filter(Boolean))];
      const out = {};
      for (let i = 0; i < unique.length; i += 50) {
        const chunk = unique.slice(i, i + 50);
        const data = await ytFetch("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=" + encodeURIComponent(chunk.join(",")) + "&maxResults=50");
        for (const item of data.items || []) out[item.id] = item;
      }
      return out;
    }
    async function fetchVideosByIds(ids) {
      const unique = [...new Set(ids.filter(Boolean))];
      const out = {};
      for (let i = 0; i < unique.length; i += 50) {
        const chunk = unique.slice(i, i + 50);
        const data = await ytFetch("https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=" + encodeURIComponent(chunk.join(",")) + "&maxResults=50");
        for (const item of data.items || []) out[item.id] = item;
      }
      return out;
    }
    function mergeLiveIntoSnapshot(live) {
      const data = deepClone(snapshotData);
      const studio = data.sources && data.sources.studio;
      if (studio && studio.channels) {
        for (const ch of studio.channels) {
          const pub = live.channels[ch.id];
          const an = live.analytics[ch.id];
          const lifeStats = pub && pub.statistics ? pub.statistics : null;
          ch.live = {
            data_api_ok: !!lifeStats,
            analytics_ok: !!(an && an.ok),
            fetched_at: live.fetchedAt,
            lifetime: lifeStats ? {
              views: Number(lifeStats.viewCount || 0),
              subscribers: lifeStats.hiddenSubscriberCount ? null : Number(lifeStats.subscriberCount || 0),
              subscribers_hidden: !!lifeStats.hiddenSubscriberCount,
              video_count: Number(lifeStats.videoCount || 0),
            } : (ch.totals_lifetime || null),
            last_28d: (an && an.ok && an.last28) ? Object.assign({}, an.last28, {
              video_count: ch.totals && ch.totals.video_count,
              videos_with_views: ch.totals && ch.totals.videos_with_views,
            }) : null,
          };
          if (an && an.ok && an.videos && an.videos.length) {
            ch.top_videos = an.videos;
          }
        }
      }
      const ta = data.sources && data.sources.tubealfred;
      if (ta) {
        for (const v of ta.outliers || []) {
          const item = live.videos[v.id];
          if (item && item.statistics) {
            v.views_live = Number(item.statistics.viewCount || 0);
            if (item.contentDetails && item.contentDetails.duration) {
              const sec = parseIsoDuration(item.contentDetails.duration);
              if (sec != null) {
                v.length_seconds = sec;
              }
            }
          }
        }
      }
      // advice stays as in snapshot
      return data;
    }
    async function pullLive() {
      const range = last28Range();
      const studioCh = (((snapshotData || {}).sources || {}).studio || {}).channels || [];
      const ownedIds = studioCh.map((c) => c.id).filter(Boolean);
      const ta = ((snapshotData || {}).sources || {}).tubealfred || {};
      const peerIds = (ta.peers || []).map((p) => p.id).filter(Boolean);
      const videoIds = (ta.outliers || []).map((v) => v.id).filter(Boolean);
      const channels = await fetchChannelsByIds(ownedIds.concat(peerIds));
      let mineNote = "";
      try {
        const mine = await ytFetch("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true");
        const mineItem = (mine.items || [])[0];
        if (mineItem && mineItem.id && ownedIds.indexOf(mineItem.id) === -1) {
          mineNote = "บัญชีที่เข้าสู่ระบบมีช่อง «" + ((mineItem.snippet && mineItem.snippet.title) || mineItem.id) + "» ซึ่งไม่ใช่ 4 ช่องในแดชบอร์ดนี้ ลองออกแล้วเข้าใหม่ด้วย sitthinon.ma@gmail.com";
        }
      } catch (err) {
        // mine=true is optional; owned analytics may still work
      }
      const analytics = {};
      let studioError = null;
      let anyAnalytics = false;
      for (const id of ownedIds) {
        try {
          const overview = await analyticsReport(id, range.start, range.end);
          const videoReport = await analyticsReport(id, range.start, range.end, { dimensions: "video", sort: "-views", maxResults: 10 });
          const last28 = metricsFromRow(parseReport(overview)[0]);
          const videoRows = parseReport(videoReport);
          const vids = videoRows.map((r) => r.video).filter(Boolean);
          const vmeta = await fetchVideosByIds(vids);
          const videos = videoRows.map((r) => {
            const meta = vmeta[r.video] || {};
            const stats = metricsFromRow(r) || {};
            const sn = meta.snippet || {};
            return {
              id: r.video,
              title: sn.title || r.video,
              url: "https://www.youtube.com/watch?v=" + r.video,
              views: stats.views,
              views_28d: stats.views,
              views_lifetime: meta.statistics ? Number(meta.statistics.viewCount || 0) : null,
              subscribers: stats.subscribers_attributed,
              average_percentage_viewed: stats.average_percentage_viewed,
              ctr_percent: stats.ctr_percent,
              duration_seconds: meta.contentDetails ? parseIsoDuration(meta.contentDetails.duration) : null,
            };
          });
          analytics[id] = { ok: true, last28: last28, videos: videos };
          anyAnalytics = true;
        } catch (err) {
          analytics[id] = { ok: false, error: classifyLiveError(err) };
          if (!studioError) studioError = classifyLiveError(err);
        }
      }
      if (ownedIds.length && !anyAnalytics && studioError) {
        // keep studioError
      } else if (anyAnalytics) {
        const failed = ownedIds.filter((id) => analytics[id] && !analytics[id].ok).length;
        studioError = failed ? ("ดึง Analytics ได้บางช่อง ช่องที่ดึงไม่ได้ยังใช้สำเนา 28 วัน") : null;
      }
      let videos = {};
      let competitorError = null;
      try {
        videos = await fetchVideosByIds(videoIds);
      } catch (err) {
        competitorError = classifyLiveError(err);
      }
      return {
        fetchedAt: nowBangkokIso(),
        range: range,
        channels: channels,
        analytics: analytics,
        videos: videos,
        studioError: studioError,
        competitorError: competitorError,
        mineNote: mineNote,
      };
    }
    async function startLive(prompt) {
      if (!snapshotData) return;
      liveMeta.status = "connecting";
      liveMeta.studioError = null;
      liveMeta.competitorError = null;
      renderPage(deepClone(snapshotData));
      try {
        const needPrompt = prompt || (accessToken && Date.now() < tokenExpiresAt ? "" : "consent");
        if (!accessToken || Date.now() >= tokenExpiresAt || prompt === "consent") {
          await requestAccessToken(needPrompt);
        }
        const live = await pullLive();
        liveMeta.status = "ok";
        liveMeta.fetchedAt = live.fetchedAt;
        liveMeta.studioError = live.studioError;
        liveMeta.competitorError = live.competitorError;
        liveMeta.mineNote = live.mineNote || "";
        renderPage(mergeLiveIntoSnapshot(live));
      } catch (err) {
        liveMeta.status = "error";
        const reason = classifyLiveError(err);
        liveMeta.studioError = reason;
        liveMeta.competitorError = reason;
        liveMeta.error = reason;
        renderPage(deepClone(snapshotData));
      }
    }
    function signOutYoutube() {
      const done = () => {
        accessToken = null;
        tokenExpiresAt = 0;
        liveMeta = { status: "idle", error: null, fetchedAt: null, studioError: null, competitorError: null, analyticsOk: {}, mineNote: "" };
        if (snapshotData) renderPage(deepClone(snapshotData));
      };
      try {
        if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
          google.accounts.oauth2.revoke(accessToken, done);
          setTimeout(done, 1500);
          return;
        }
      } catch (e) {}
      done();
    }

    boot();
  </script>
